spring:
  application:
    name: pesachain-api
  datasource:
    url: ${PESACHAIN_DB_URL:jdbc:postgresql://localhost:5432/pesachain}
    username: ${PESACHAIN_DB_USERNAME:pesachain}
    password: ${PESACHAIN_DB_PASSWORD:B87FE04E67ED0D83A47AAD3D31BC9390447F47D754772534BDC99BAB6EC3ADAB}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${PESACHAIN_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

pesachain:
  simulation:
    hmac-secret: ${PESACHAIN_SIMULATION_HMAC_SECRET:}
  blockchain:
    worker:
      enabled: ${PESACHAIN_BLOCKCHAIN_WORKER_ENABLED:true}
    rpc-url: ${PESACHAIN_RPC_URL:http://127.0.0.1:8545}
    chain-id: ${PESACHAIN_CHAIN_ID:31337}
    contract-address: ${PESACHAIN_CONTRACT_ADDRESS:0x5fbdb2315678afecb367f032d93f642f64180aa3}
    signer-private-key: ${PESACHAIN_BLOCKCHAIN_SIGNER_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    required-confirmations: ${PESACHAIN_BLOCKCHAIN_CONFIRMATIONS:1}
    gas-limit: ${PESACHAIN_BLOCKCHAIN_GAS_LIMIT:500000}
    worker-interval-ms: ${PESACHAIN_BLOCKCHAIN_WORKER_INTERVAL_MS:2000}
    lease-ms: ${PESACHAIN_BLOCKCHAIN_LEASE_MS:60000}
    max-attempts: ${PESACHAIN_BLOCKCHAIN_MAX_ATTEMPTS:8}
    retry-base-ms: ${PESACHAIN_BLOCKCHAIN_RETRY_BASE_MS:2000}
    retry-max-ms: ${PESACHAIN_BLOCKCHAIN_RETRY_MAX_MS:300000}
