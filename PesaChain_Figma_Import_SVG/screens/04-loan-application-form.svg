<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F5F7F6"/><g id="Sidebar"><title>Sidebar</title><rect x="0" y="0" width="248" height="1000" rx="0" fill="#12333B"/></g><g id="Brand"><title>Brand</title><text x="28" y="42" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="start">Pesa</text><text x="82" y="42" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#75C7B7" text-anchor="start">Chain</text><text x="28" y="64" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="600" fill="#BBD0D0" text-anchor="start" letter-spacing="0.7">MICROFINANCE • TRUST • RECORDS</text></g><path d="M20 86 L228 86" fill="none" stroke="#31555C" stroke-width="1"/><text x="26" y="118" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#91AFB1" text-anchor="start" letter-spacing="1.4">BORROWER</text><rect x="28" y="132" width="13" height="13" rx="4" fill="#739095"/><text x="52" y="143" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="450" fill="#CCDADB" text-anchor="start">Overview</text><rect x="14" y="166" width="218" height="36" rx="7" fill="#1B5960"/><rect x="28" y="178" width="13" height="13" rx="4" fill="#79BFB3"/><text x="52" y="189" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start">My applications</text><rect x="28" y="224" width="13" height="13" rx="4" fill="#739095"/><text x="52" y="235" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="450" fill="#CCDADB" text-anchor="start">My loans</text><rect x="28" y="270" width="13" height="13" rx="4" fill="#739095"/><text x="52" y="281" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="450" fill="#CCDADB" text-anchor="start">Profile</text><path d="M20 905 L228 905" fill="none" stroke="#31555C" stroke-width="1"/><text x="27" y="935" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#C5D8D8" text-anchor="start">Help &amp; accessibility</text><g id="Top bar"><title>Top bar</title><rect x="248" y="0" width="1192" height="70" rx="0" fill="#FFFFFF"/><path d="M248 69 L1440 69" fill="none" stroke="#E1E8E6" stroke-width="1"/><text x="280" y="43" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#647579" text-anchor="start">PesaChain  /  Loan application form</text><text x="1250" y="41" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#147D78" text-anchor="start">●</text><text x="1270" y="43" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1C2C30" text-anchor="start">Demo User</text><text x="1390" y="43" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#647579" text-anchor="start">⌄</text></g><g id="Page heading"><title>Page heading</title><text x="282" y="116" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="720" fill="#1C2C30" text-anchor="start">Loan application form</text><rect x="1155" y="92" width="225" height="42" rx="7" fill="#147D78"/><text x="1267.5" y="118.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF" text-anchor="middle">Review application</text></g><g id="Page content"><title>Page content</title><rect x="282" y="170" width="760" height="680" rx="10" fill="#FFFFFF" stroke="#E1E8E6" stroke-width="1"/><text x="302" y="199" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#1C2C30" text-anchor="start">Application details</text><text x="302" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#647579" text-anchor="start">Tell us what you need. Required fields are marked with an asterisk.</text><text x="310" y="262" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#647579" text-anchor="start">Requested amount (KES) *</text><rect x="310" y="272" width="700" height="42" rx="7" fill="#FFFFFF" stroke="#E1E8E6" stroke-width="1"/><text x="323" y="298" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#1C2C30" text-anchor="start">12,500.00</text><text x="310" y="329" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#647579" text-anchor="start">Enter a positive amount. Final currency and amount rules follow institution policy.</text><text x="310" y="380" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#647579" text-anchor="start">Purpose of the loan *</text><rect x="310" y="390" width="700" height="42" rx="7" fill="#FFFFFF" stroke="#E1E8E6" stroke-width="1"/><text x="323" y="416" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#1C2C30" text-anchor="start">Stock for my small shop</text><text x="310" y="449" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#647579" text-anchor="start">Briefly explain how the loan will be used.</text><text x="310" y="496" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" fill="#1C2C30" text-anchor="start">Before you submit</text><text x="310" y="527" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#647579" text-anchor="start">• Your application will be marked PENDING.</text><text x="310" y="553" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#647579" text-anchor="start">• A loan officer will review the information.</text><text x="310" y="579" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#647579" text-anchor="start">• Submission does not guarantee approval.</text><rect x="310" y="635" width="190" height="42" rx="7" fill="#147D78"/><text x="405.0" y="661.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF" text-anchor="middle">Review application</text><rect x="515" y="635" width="140" height="42" rx="7" fill="#FFFFFF" stroke="#E1E8E6" stroke-width="1"/><text x="585.0" y="661.0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#12333B" text-anchor="middle">Save and exit</text><rect x="1060" y="170" width="322" height="260" rx="10" fill="#FFFFFF" stroke="#E1E8E6" stroke-width="1"/><text x="1080" y="199" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#1C2C30" text-anchor="start">Application checklist</text><text x="1080" y="222" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#647579" text-anchor="start">Check your details before submission.</text><rect x="1082" y="235" width="164.0" height="27" rx="13" fill="#E7F4F1"/><text x="1164.0" y="253" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" fill="#147D78" text-anchor="middle">Required information</text><text x="1082" y="288" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1C2C30" text-anchor="start">Amount</text><text x="1320" y="288" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#217A56" text-anchor="end">Complete</text><text x="1082" y="326" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#1C2C30" text-anchor="start">Purpose</text><text x="1320" y="326" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#217A56" text-anchor="end">Complete</text></g><g id="Footer"><title>Footer</title><text x="282" y="976" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#647579" text-anchor="start">PesaChain  •  Operational data is private; only selected events are verified on-chain.</text></g></svg>